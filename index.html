<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Santa 🎄</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#14532d;
    color:white;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.box{
    background:rgba(255,255,255,.1);
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

input,select,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
}

button{
    background:#dc2626;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#b91c1c;
}

#card{
    display:none;
    background:white;
    color:black;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
    text-align:center;
}

#targetName{
    font-size:30px;
    font-weight:bold;
    color:green;
}

.success{
    color:#90ee90;
    margin-top:10px;
}

.progress{
    margin-top:10px;
}
</style>
</head>

<h1>🎄 Secret Santa 🎁</h1>

<input

placeholder="PIN">

<button id="generateBtn">

</button>

<button id="resetBtn">

</button>

<div id="adminStatus"></div>

</div>

<select id="playerSelect">

</option>
</select>
