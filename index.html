
<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Santa 🎄</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px 16px 90px;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(ellipse at top, #28764b 0%, transparent 60%),
        linear-gradient(135deg, #032d1b, #14532d, #06351e);
    overflow-x: hidden;
}

.container {
    max-width: 920px;
    margin: auto;
    position: relative;
    z-index: 2;
}

/* ANTRAŠTĖ */

.header {
    text-align: center;
    margin: 15px 0 30px;
}

.header h1 {
    font-family: Georgia, serif;
    font-size: clamp(35px, 6vw, 65px);
    font-style: italic;
    color: #fff3c4;
    text-shadow: 0 0 15px #fbbf24, 0 4px 10px #000;
    margin: 0;
    animation: glow 3s infinite alternate;
}

.header p {
    color: #fde68a;
    letter-spacing: 3px;
    font-size: 13px;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #fbbf24; }
    to { text-shadow: 0 0 25px #fff, 0 0 40px #fbbf24; }
}

/* KALĖDINĖS LEMPUTĖS */

.lights {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 65px;
    display: flex;
    justify-content: space-around;
    pointer-events: none;
    z-index: 3;
    border-top: 2px solid rgba(255,255,255,.3);
}

.bulb {
    width: 13px;
    height: 20px;
    border-radius: 50%;
    margin-top: 3px;
    animation: bulbGlow 1.5s infinite alternate;
}

.bulb:nth-child(4n+1) { background: #facc15; box-shadow: 0 0 18px #facc15; }
.bulb:nth-child(4n+2) { background: #ef4444; box-shadow: 0 0 18px #ef4444; animation-delay: .4s; }
.bulb:nth-child(4n+3) { background: #22c55e; box-shadow: 0 0 18px #22c55e; animation-delay: .8s; }
.bulb:nth-child(4n) { background: #60a5fa; box-shadow: 0 0 18px #60a5fa; animation-delay: .2s; }

@keyframes bulbGlow {
    from { opacity: .5; }
    to { opacity: 1; }
}

/* ŠONINĖS DEKORACIJOS */

.side-decoration {
    position: fixed;
    bottom: 15px;
    font-size: 110px;
    z-index: 0;
    pointer-events: none;
    filter: drop-shadow(0 0 15px rgba(255,255,255,.2));
}

.tree {
    right: 10px;
    animation: treeGlow 3s infinite alternate;
}

.snowman {
    left: 5px;
    font-size: 100px;
}

@keyframes treeGlow {
    from { filter: drop-shadow(0 0 5px #facc15); }
    to { filter: drop-shadow(0 0 25px #facc15); }
}

/* LANGAI */

.box {
    background: rgba(15, 75, 42, .82);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 22px;
    padding: 28px;
    margin-bottom: 25px;
    box-shadow:
        0 12px 30px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.1);
    transition: transform .3s, box-shadow .3s;
    position: relative;
}

.box:hover {
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
    transform: translateY(-2px);
}

.box h2 {
    margin: 0 0 20px;
    font-size: 24px;
}

/* FORMOS */

input, select, button {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 15px;
    margin-top: 12px;
    border: none;
    border-radius: 11px;
    font-family: Arial, sans-serif;
    font-size: 15px;
}

input, select {
    background: #fff;
    color: #222;
    outline: none;
    transition: box-shadow .3s;
}

input:focus, select:focus {
    box-shadow: 0 0 0 4px rgba(250,204,21,.4);
}

/* RAUDONI MYGTUKAI */

button {
    background: linear-gradient(135deg, #ef2929, #c81010);
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.2);
    transition: all .25s;
}

button:hover {
    background: linear-gradient(135deg, #ff4b4b, #b91c1c);
    transform: translateY(-3px);
    box-shadow: 0 7px 18px rgba(0,0,0,.3);
}

button:active {
    transform: scale(.98);
}

button:disabled {
    opacity: .6;
    cursor: wait;
    transform: none;
}

/* DOVANOS KORTELE */

#card {
    display: none;
    margin-top: 25px;
    padding: 30px 15px;
    text-align: center;
    border-radius: 18px;
    color: #14532d;
    background: linear-gradient(135deg, #fffdf2, #fef0c0);
    border: 3px solid #facc15;
    box-shadow: 0 0 25px rgba(250,204,21,.5);
    position: relative;
    overflow: hidden;
}

#card.show {
    display: block;
    animation: reveal .8s cubic-bezier(.2,.8,.3,1.3);
}

#card h3 {
    font-size: 23px;
}

#targetName {
    font-family: Georgia, serif;
    font-size: clamp(30px, 6vw, 48px);
    font-weight: bold;
    color: #15803d;
    margin: 20px 0;
    text-shadow: 0 2px 8px rgba(21,128,61,.2);
}

.greeting {
    color: #dc2626;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 24px;
}

@keyframes reveal {
    0% {
        opacity: 0;
        transform: scale(.5) rotate(-8deg);
    }
    70% {
        transform: scale(1.06) rotate(2deg);
    }
    100% {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

/* PROGRESAS */

.progress {
    margin-top: 18px;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 10px;
}

.progress-icon {
    background: #22c55e;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

/* SNAIGĖS */

#snow {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.snowflake {
    position: absolute;
    top: -30px;
    color: white;
    animation: snowfall linear infinite;
    text-shadow: 0 0 7px white;
}

@keyframes snowfall {
    0% {
        transform: translate3d(0,-10vh,0) rotate(0deg);
    }
    100% {
        transform: translate3d(70px,110vh,0) rotate(360deg);
    }
}

/* KONFETI */

.confetti {
    position: fixed;
    top: -20px;
    z-index: 20;
    pointer-events: none;
    animation: confettiFall 3s linear forwards;
}

@keyframes confettiFall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

/* MUZIKOS MYGTUKAS */

.music-button {
    position: fixed;
    right: 22px;
    bottom: 20px;
    width: auto;
    z-index: 30;
    border-radius: 50px;
    padding: 15px 22px;
}

/* SĖKMĖS PRANEŠIMAS */

.success {
    color: #bbf7d0;
    font-weight: bold;
    margin-top: 15px;
}

/* TELEFONAI */

@media(max-width: 650px) {
    body {
        padding: 20px 12px 90px;
    }

    .box {
        padding: 20px 16px;
    }

    .box h2 {
        font-size: 21px;
    }

    .header {
        margin-top: 35px;
    }

    .side-decoration {
        font-size: 65px;
        opacity: .65;
    }

    .snowman {
        font-size: 60px;
    }

    .music-button {
        right: 12px;
        bottom: 12px;
        padding: 12px 16px;
        font-size: 13px;
    }
}

@media(prefers-reduced-motion: reduce) {
    .snowflake, .header h1, .bulb, .tree {
        animation: none !important;
    }
}
</style>
</head>

<body>

<!-- LEMPUTĖS -->

<div class="lights">
    <span class="bulb"></span>
    <span class="bulb"></span>
    <span class="bulb"></span>
    <span class="bulb"></span>
    <span class="bulb"></span>
    <span class="bulb"></span>
    <span class="bulb"></span>
    <span class="bulb"></span>
    <span class="bulb"></span>
    <span class="bulb"></span>
</div>

<!-- SNAIGĖS -->

<div id="snow"></div>

<!-- DEKORACIJOS -->

<div class="side-decoration snowman">⛄</div>
<div class="side-decoration tree">🎄</div>

<div class="container">

    <header class="header">
        <h1>🎄 Secret Santa 🎁</h1>
        <p>MAGIŠKAS KALĖDINIS DOVANŲ ŽAIDIMAS</p>
    </header>

    <!-- ADMINISTRATORIUS -->

    <div class="box">

        <h2>👤 Administratorius</h2>

        <input
            id="adminPin"
            type="password"
            placeholder="🔒 PIN"
            autocomplete="off"
        >

        <button id="generateBtn">
            🎲 Sugeneruoti poras
        </button>

        <button id="resetBtn">
            ♻️ Naujas žaidimas
        </button>

        <div id="adminStatus"></div>

    </div>

    <!-- DALYVIS -->

    <div class="box">

        <h2>🎅 Dalyvis</h2>

        <select id="playerSelect">
            <option value="">Pasirink savo vardą</option>
        </select>

        <button id="drawBtn">
            🎁 Traukti kortelę
        </button>

        <!-- DOVANOS KORTELE -->

        <div id="card">

            <h3>🎄 Tu dovanoji:</h3>

            <div id="targetName"></div>

            <div class="greeting">
                🎁 Gražių švenčių! 🎁
            </div>

        </div>

        <div class="progress" id="progress">
            <span class="progress-icon">✓</span>
            Ištraukė: 0/0
        </div>

    </div>

</div>

<!-- MUZIKA -->

<button class="music-button" id="musicBtn">
    🔇 Įjungti muziką
</button>

<script>

// ========================================
// 1. ADMINISTRATORIAUS PIN
// ========================================

const ADMIN_PIN = "1234";


// ========================================
// 2. SUPABASE DUOMENYS
// ========================================

const SUPABASE_URL =
"https://svxoxpuqrqwpqdbiokgc.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_o07RJCKWedO1LUEJQ61hgQ_EpbTJV5z";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


// ========================================
// 3. SNAIGIŲ ANIMACIJA
// ========================================

const snowContainer = document.getElementById("snow");

for(let i = 0; i < 55; i++) {

    const snow = document.createElement("div");

    snow.className = "snowflake";
    snow.textContent = "❄";

    snow.style.left = Math.random() * 100 + "%";
    snow.style.fontSize = (Math.random() * 14 + 7) + "px";
    snow.style.animationDuration = (Math.random() * 8 + 7) + "s";
    snow.style.animationDelay = (Math.random() * 10) + "s";
    snow.style.opacity = Math.random() * .7 + .3;

    snowContainer.appendChild(snow);
}


// ========================================
// 4. KONFETI EFEKTAS
// ========================================

function launchConfetti() {

    const colors = [
        "#ef4444",
        "#facc15",
        "#22c55e",
        "#ffffff",
        "#3b82f6"
    ];

    for(let i = 0; i < 65; i++) {

        const piece = document.createElement("div");

        piece.className = "confetti";
        piece.textContent = Math.random() > .5 ? "✦" : "●";

        piece.style.left = Math.random() * 100 + "vw";
        piece.style.color =
            colors[Math.floor(Math.random() * colors.length)];

        piece.style.fontSize =
            (Math.random() * 12 + 7) + "px";

        piece.style.animationDuration =
            (Math.random() * 2 + 2) + "s";

        document.body.appendChild(piece);

        setTimeout(() => piece.remove(), 4500);
    }
}


// ========================================
// 5. KALĖDINĖ MUZIKA
// ORIGINALI VARPELIŲ MELODIJA
// ========================================

let audioContext = null;
let musicPlaying = false;
let musicTimer = null;
let noteIndex = 0;

const melody = [
    [659,300],[659,300],[659,600],
    [659,300],[659,300],[659,600],
    [659,300],[784,300],[523,450],
    [587,150],[659,900],
    [698,300],[698,300],[698,450],
    [698,150],[698,300],[659,300],
    [659,300],[659,150],[659,150],
    [659,300],[587,300],[587,300],
    [659,300],[587,600],[784,600]
];

function playBell(freq, duration) {

    if(!audioContext) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = freq;

    gain.gain.setValueAtTime(
        0.0001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.12,
        audioContext.currentTime + .02
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + duration / 1000
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(
        audioContext.currentTime + duration / 1000
    );
}

function playMelody() {

    if(!musicPlaying) return;

    const [freq, duration] = melody[noteIndex];

    playBell(freq, duration);

    noteIndex = (noteIndex + 1) % melody.length;

    musicTimer = setTimeout(
        playMelody,
        duration + 100
    );
}

document.getElementById("musicBtn").addEventListener(
    "click",
    async function() {

        if(!audioContext) {

            const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

            if(!AudioContextClass) {
                alert("Naršyklė nepalaiko muzikos.");
                return;
            }

            audioContext = new AudioContextClass();
        }

        if(audioContext.state === "suspended") {
            await audioContext.resume();
        }

        musicPlaying = !musicPlaying;

        if(musicPlaying) {

            noteIndex = 0;
            playMelody();

            this.innerText = "🔊 Išjungti muziką";

        } else {

            clearTimeout(musicTimer);

            this.innerText = "🔇 Įjungti muziką";
        }
    }
);


// ========================================
// 6. PORŲ SUMAIŠYMAS
// ========================================

function shuffle(arr) {

    const copy = [...arr];

    for(let i = copy.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}

function generateSecretSanta(players) {

    if(players.length < 2) {
        throw new Error("Reikia bent dviejų dalyvių!");
    }

    let shuffled;

    do {

        shuffled = shuffle(players);

    } while(
        players.some((p, i) => p.id === shuffled[i].id)
    );

    return shuffled;
}


// ========================================
// 7. DALYVIŲ ĮKĖLIMAS
// ========================================

async function loadPlayers() {

    const {data, error} = await db
        .from("participants")
        .select("*")
        .order("name");

    if(error) {

        console.error(error);

        alert("Nepavyko įkelti dalyvių: " + error.message);

        return;
    }

    const select = document.getElementById("playerSelect");

    select.innerHTML =
        '<option value="">Pasirink savo vardą</option>';

    data.forEach(player => {

        const option = document.createElement("option");

        option.value = player.name;

        option.textContent = player.drawn
            ? player.name + " ✅"
            : player.name;

        option.disabled = player.drawn;

        select.appendChild(option);
    });

    updateProgress(data);
}


// ========================================
// 8. ŽAIDIMO PROGRESAS
// ========================================

async function updateProgress(players = null) {

    if(!players) {

        const {data, error} = await db
            .from("participants")
            .select("drawn");

        if(error) return;

        players = data;
    }

    const done = players.filter(x => x.drawn).length;

    document.getElementById("progress").innerHTML =
        `<span class="progress-icon">✓</span>
         Ištraukė: ${done}/${players.length}`;
}


// ========================================
// 9. PORŲ GENERAVIMAS
// ========================================

async function generatePairs() {

    const pin = document.getElementById("adminPin").value;
    const btn = document.getElementById("generateBtn");

    if(pin !== ADMIN_PIN) {
        alert("Neteisingas PIN!");
        return;
    }

    btn.disabled = true;

    try {

        const {data, error} = await db
            .from("participants")
            .select("*");

        if(error) throw error;

        const pairs = generateSecretSanta(data);

        for(let i = 0; i < data.length; i++) {

            const {error: updateError} = await db
                .from("participants")
                .update({
                    target: pairs[i].name,
                    drawn: false
                })
                .eq("id", data[i].id);

            if(updateError) throw updateError;
        }

        document.getElementById("adminStatus").innerHTML =
            '<div class="success">🎄 Poros sėkmingai sugeneruotos!</div>';

        document.getElementById("adminPin").value = "";

        await loadPlayers();

    } catch(error) {

        alert(error.message);
    }

    btn.disabled = false;
}


// ========================================
// 10. DOVANOS TRAUKIMAS
// ========================================

async function drawGift() {

    const player = document.getElementById("playerSelect").value;
    const btn = document.getElementById("drawBtn");

    if(!player) {
        alert("Pasirink savo vardą!");
        return;
    }

    btn.disabled = true;

    try {

        const {data, error} = await db
            .from("participants")
            .select("*")
            .eq("name", player)
            .single();

        if(error) throw error;

        if(!data.target) {
            alert("Administratorius dar nesugeneravo porų!");
            return;
        }

        if(data.drawn) {
            alert("Jau ištraukei!");
            return;
        }

        const {error: updateError} = await db
            .from("participants")
            .update({drawn: true})
            .eq("name", player);

        if(updateError) throw updateError;

        document.getElementById("targetName").innerText =
            data.target;

        document.getElementById("card").classList.add("show");

        launchConfetti();

        await updateProgress();

        setTimeout(() => {

            document.getElementById("card").classList.remove("show");

            document.getElementById("targetName").innerText = "";

            loadPlayers();

        }, 10000);

    } catch(error) {

        alert(error.message);
    }

    btn.disabled = false;
}


// ========================================
// 11. NAUJAS ŽAIDIMAS
// ========================================

async function resetGame() {

    const pin = document.getElementById("adminPin").value;

    if(pin !== ADMIN_PIN) {
        alert("Neteisingas PIN!");
        return;
    }

    if(!confirm("Ar tikrai norite pradėti naują žaidimą?")) {
        return;
    }

    const btn = document.getElementById("resetBtn");

    btn.disabled = true;

    try {

        const {error} = await db
            .from("participants")
            .update({
                target: null,
                drawn: false
            })
            .not("id", "is", null);

        if(error) throw error;

        document.getElementById("adminStatus").innerHTML =
            '<div class="success">♻️ Žaidimas atstatytas!</div>';

        document.getElementById("adminPin").value = "";

        document.getElementById("card").classList.remove("show");

        document.getElementById("targetName").innerText = "";

        await loadPlayers();

    } catch(error) {

        alert(error.message);
    }

    btn.disabled = false;
}


// ========================================
// 12. MYGTUKAI
// ========================================

document.getElementById("generateBtn")
    .addEventListener("click", generatePairs);

document.getElementById("drawBtn")
    .addEventListener("click", drawGift);

document.getElementById("resetBtn")
    .addEventListener("click", resetGame);


// ========================================
// 13. PALEIDIMAS
// ========================================

loadPlayers();

</script>

</body>
</html>
